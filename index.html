<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-Do Tracker</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e6e6e8;--widget:#ffffff;--tile:#d3d3d7;--ink:#101012;--muted:#6c6c72;--edge:rgba(0,0,0,.08);--glow:rgba(0,0,0,.06);--badge:#e5372f;--onink:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121213;--widget:#000000;--tile:#2b2b2e;--ink:#f2f2f7;--muted:#8e8e93;--edge:rgba(255,255,255,.08);--glow:rgba(255,255,255,.07);--badge:#ef4444;--onink:#000000;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#121213;--widget:#000000;--tile:#2b2b2e;--ink:#f2f2f7;--muted:#8e8e93;--edge:rgba(255,255,255,.08);--glow:rgba(255,255,255,.07);--badge:#ef4444;--onink:#000000;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Outfit,"Segoe UI",system-ui,sans-serif;line-height:1.35;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;background:var(--glow);filter:blur(90px);pointer-events:none;z-index:0;animation:drift 24s ease-in-out infinite alternate}
.b1{width:420px;height:420px;top:30%;right:-160px}
.b2{width:360px;height:360px;bottom:-120px;left:-120px;animation-duration:30s;animation-delay:-9s}
@keyframes drift{to{transform:translate(-60px,-70px) scale(1.2)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:26px 16px 56px}
.date{margin:0;text-align:center;font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.hero{text-align:center;margin:0 0 4px}
.hero b{display:block;font-family:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;font-weight:900;font-size:min(36vw,10.5rem);line-height:.92;letter-spacing:.01em}
.hero span{display:block;margin-top:2px;font-size:.95rem;font-weight:600;color:var(--muted);letter-spacing:.14em}
.widget{background:var(--widget);border:1px solid var(--edge);border-radius:30px}
.stat{display:flex;align-items:center;gap:16px;padding:18px 22px;margin:16px 0 14px}
.stat .n{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:2.6rem;line-height:1}
.stat .l{font-size:.78rem;font-weight:700;line-height:1.15;letter-spacing:.06em}
.stat i{width:1px;align-self:stretch;background:var(--edge);background:var(--muted);opacity:.4}
.stat .r{flex:1;min-width:0}
.bar{display:flex;align-items:center;gap:12px}
.track{flex:1;height:9px;border-radius:99px;background:var(--tile);overflow:hidden}
.track div{height:100%;width:0;border-radius:99px;background:var(--ink);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar em{font-style:normal;font-weight:500;color:var(--muted);min-width:2.6em;text-align:right}
.stat p{margin:8px 0 0;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#alert{display:none;align-items:center;gap:10px;padding:14px 18px;margin-bottom:14px;background:var(--ink);color:var(--onink);border-radius:24px;animation:pop .4s}
#alert.on{display:flex}
#alert div{flex:1;font-weight:600}
#alert button{border:1px solid currentColor;background:none;color:inherit;border-radius:12px;padding:6px 12px;cursor:pointer;font:inherit}
form.add{padding:14px;margin-bottom:14px;display:grid;gap:10px}
.field{width:100%;min-width:0;padding:15px 16px;font:inherit;color:var(--ink);background:var(--tile);border:1px solid transparent;border-radius:18px;transition:border-color .2s}
.field:focus{outline:none;border-color:var(--ink)}
.field::placeholder{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg label{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 0;border-radius:18px;background:var(--tile);color:var(--muted);font-weight:600;font-size:.92rem;cursor:pointer;transition:.2s}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--dot)}
.seg label:has(input:checked){background:var(--ink);color:var(--onink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{border:0;border-radius:18px;padding:15px;font:inherit;font-weight:700;background:var(--ink);color:var(--onink);cursor:pointer;transition:transform .15s,opacity .2s}
.go:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tabs{display:flex;width:fit-content;margin:0 auto 14px;padding:5px;gap:4px;border-radius:99px;background:var(--widget);border:1px solid var(--edge)}
.tab{padding:9px 20px;border:0;border-radius:99px;background:none;color:var(--muted);font:inherit;font-weight:600;cursor:pointer;transition:.25s}
.tab[aria-pressed=true]{background:var(--ink);color:var(--onink)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:14px;padding:16px 14px 16px 16px;margin-bottom:10px;background:var(--tile);border-radius:26px;transition:opacity .3s,transform .25s}
li:active{transform:scale(.98)}
li.in{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
li.out{opacity:0;transform:translateX(50px)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}}
li input{appearance:none;-webkit-appearance:none;flex:none;width:30px;height:30px;border:2px solid var(--muted);border-radius:50%;background:transparent;cursor:pointer;position:relative;transition:.25s}
li input:checked{background:var(--ink);border-color:var(--ink)}
li input:checked::after{content:"";position:absolute;left:10px;top:4px;width:7px;height:13px;border:solid var(--onink);border-width:0 3px 3px 0;transform:rotate(45deg)}
li span{flex:1;font-weight:600;word-break:break-word;transition:color .3s}
li.done span{color:var(--muted);text-decoration:line-through}
li small{display:block;margin-top:2px;font-size:.78rem;font-weight:500;color:var(--muted)}
li small.late{color:var(--badge);font-weight:700}
.dot{flex:none;width:11px;height:11px;border-radius:50%;background:var(--dot)}
.x{border:0;background:none;color:var(--muted);font-size:1.4rem;line-height:1;cursor:pointer;padding:6px 8px;border-radius:12px}
.x:hover{color:var(--ink)}
.empty{text-align:center;padding:34px 20px;color:var(--muted);background:var(--widget);border-radius:26px}
.foot{display:flex;justify-content:space-between;align-items:center;padding:0 8px;margin-top:6px;color:var(--muted);font-size:.9rem}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.blob,li.in,#alert{animation:none}.track div,.go,li{transition:none}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<canvas id="fx"></canvas>
<main>
  <p class="date" id="date"></p>
  <div class="hero"><b id="left">00</b><span>TASKS LEFT</span></div>

  <section class="widget stat">
    <div class="n" id="done">0</div>
    <div class="l">DONE<br>TODAY</div>
    <i></i>
    <div class="r">
      <div class="bar"><div class="track"><div id="fill"></div></div><em id="pct">0%</em></div>
      <p id="sub"></p>
    </div>
  </section>

  <div id="alert" role="alert"><div id="alertText"></div><button id="alertClose">Dismiss</button></div>

  <form class="add widget" id="form">
    <input class="field" type="text" id="text" placeholder="Add a task" aria-label="Task" maxlength="200" autocomplete="off">
    <div class="seg" role="radiogroup" aria-label="Priority">
      <label style="--dot:var(--badge)"><input type="radio" name="pri" value="high"><span>High</span></label>
      <label style="--dot:var(--ink)"><input type="radio" name="pri" value="medium" checked><span>Medium</span></label>
      <label style="--dot:var(--muted)"><input type="radio" name="pri" value="low"><span>Low</span></label>
    </div>
    <div class="row">
      <input class="field" type="datetime-local" id="due" aria-label="Reminder time (optional)">
      <button class="go" type="submit">Add task</button>
    </div>
  </form>

  <div class="tabs" id="tabs">
    <button class="tab" data-f="all" aria-pressed="true">All</button>
    <button class="tab" data-f="active" aria-pressed="false">To do</button>
    <button class="tab" data-f="done" aria-pressed="false">Done</button>
  </div>

  <ul id="list"></ul>

  <div class="foot">
    <span id="count"></span>
    <button class="link" id="clear">Clear completed</button>
  </div>
</main>

<script>
(function(){
  var KEY="todo-tracker-v1", tasks=[], filter="all", justAdded=null;
  try{ var raw=localStorage.getItem(KEY); if(raw) tasks=JSON.parse(raw)||[]; }catch(e){ tasks=[]; }
  if(!Array.isArray(tasks)) tasks=[];
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(tasks)); }catch(e){} }
  var order={high:0,medium:1,low:2}, dots={high:"var(--badge)",medium:"var(--ink)",low:"var(--muted)"};
  var calm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

  var cv=document.getElementById("fx"), cx=cv.getContext("2d"), parts=[], running=false;
  function fit(){ cv.width=innerWidth; cv.height=innerHeight; }
  fit(); addEventListener("resize",fit);
  function burst(x,y,n,spread){
    if(calm) return;
    var dark=getComputedStyle(document.body).color, cols=[dark,"#8e8e93","#c7c7cc","#ef4444"];
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2, v=3+Math.random()*(spread||6);
      parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,s:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],l:1,o:i%3===0});
    }
    if(!running){ running=true; requestAnimationFrame(tick); }
  }
  function tick(){
    cx.clearRect(0,0,cv.width,cv.height);
    parts=parts.filter(function(p){ return p.l>0 && p.y<cv.height+20; });
    parts.forEach(function(p){
      p.vy+=.18; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.l-=.008;
      cx.save(); cx.globalAlpha=Math.max(p.l,0); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
      if(p.o){ cx.beginPath(); cx.arc(0,0,p.s/2,0,6.3); cx.fill(); } else cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);
      cx.restore();
    });
    if(parts.length) requestAnimationFrame(tick); else { running=false; cx.clearRect(0,0,cv.width,cv.height); }
  }

  function pad(n){ return n<10?"0"+n:""+n; }
  function setNum(id,n,two){
    var el=document.getElementById(id), from=+el.dataset.v||0; el.dataset.v=n;
    var f=function(v){ return two?pad(v):""+v; };
    if(calm||from===n){ el.textContent=f(n); return; }
    var t0=performance.now();
    (function s(t){ var k=Math.min((t-t0)/500,1); el.textContent=f(Math.round(from+(n-from)*(1-Math.pow(1-k,3)))); if(k<1) requestAnimationFrame(s); })(t0);
  }

  function render(){
    var list=document.getElementById("list"); list.innerHTML="";
    var shown=tasks.filter(function(t){ return filter==="all"||(filter==="done"?t.done:!t.done); })
      .sort(function(a,b){ return (a.done-b.done)||(order[a.pri]-order[b.pri])||(a.id-b.id); });
    if(!shown.length){
      var e=document.createElement("div"); e.className="empty";
      e.textContent=tasks.length?"Nothing here yet.":"No tasks yet. Add your first one above.";
      list.appendChild(e);
    }
    shown.forEach(function(t){
      var li=document.createElement("li");
      li.className=(t.done?"done":"")+(t.id===justAdded?" in":"");
      var cb=document.createElement("input"); cb.type="checkbox"; cb.checked=t.done; cb.setAttribute("aria-label","Mark done");
      cb.onchange=function(){
        var r=cb.getBoundingClientRect(); t.done=cb.checked; save();
        if(t.done){
          burst(r.left+r.width/2,r.top+r.height/2,24,6);
          if(!tasks.filter(function(q){return !q.done}).length&&tasks.length) burst(innerWidth/2,innerHeight*.28,130,11);
        }
        render();
      };
      var s=document.createElement("span"); s.textContent=t.text;
      if(t.due){
        var sm=document.createElement("small");
        sm.textContent="Remind "+new Date(t.due).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
        if(!t.done&&new Date(t.due).getTime()<Date.now()) sm.className="late";
        s.appendChild(sm);
      }
      var d=document.createElement("i"); d.className="dot"; d.style.setProperty("--dot",dots[t.pri]||dots.medium); d.title=t.pri;
      var x=document.createElement("button"); x.className="x"; x.textContent="\u00d7"; x.setAttribute("aria-label","Delete task");
      x.onclick=function(){
        li.classList.add("out");
        setTimeout(function(){ tasks=tasks.filter(function(q){return q.id!==t.id}); save(); render(); },calm?0:260);
      };
      li.appendChild(cb); li.appendChild(s); li.appendChild(d); li.appendChild(x); list.appendChild(li);
    });
    justAdded=null;
    var done=tasks.filter(function(t){return t.done}).length, total=tasks.length, left=total-done, p=total?Math.round(done/total*100):0;
    setNum("left",left,true); setNum("done",done,false);
    document.getElementById("fill").style.width=p+"%";
    document.getElementById("pct").textContent=p+"%";
    document.getElementById("sub").textContent=total?(done+" of "+total+" tasks complete"):"Nothing planned yet";
    document.getElementById("count").textContent=left+" left";
  }

  document.getElementById("date").textContent=new Date().toLocaleDateString([],{weekday:"short",day:"2-digit",month:"short"});

  document.getElementById("form").addEventListener("submit",function(ev){
    ev.preventDefault();
    var inp=document.getElementById("text"), v=inp.value.trim(); if(!v) return;
    var due=document.getElementById("due").value;
    var t={id:Date.now(),text:v,pri:document.querySelector("input[name=pri]:checked").value,done:false,due:due||"",notified:false};
    tasks.push(t); justAdded=t.id;
    if(due){ try{ if("Notification" in window && Notification.permission==="default") Notification.requestPermission(); }catch(e){} }
    document.getElementById("due").value=""; inp.value=""; save(); render(); inp.focus();
  });

  document.getElementById("tabs").addEventListener("click",function(ev){
    var b=ev.target.closest(".tab"); if(!b) return;
    filter=b.dataset.f;
    document.querySelectorAll(".tab").forEach(function(el){ el.setAttribute("aria-pressed",el===b?"true":"false"); });
    render();
  });

  document.getElementById("clear").onclick=function(){ tasks=tasks.filter(function(t){return !t.done}); save(); render(); };

  function checkReminders(){
    var now=Date.now(), fired=[];
    tasks.forEach(function(t){ if(t.due&&!t.done&&!t.notified&&new Date(t.due).getTime()<=now){ t.notified=true; fired.push(t); } });
    if(!fired.length) return;
    save(); render();
    fired.forEach(function(t){
      try{ if("Notification" in window && Notification.permission==="granted") new Notification("Task reminder",{body:t.text}); }catch(e){}
    });
    document.getElementById("alertText").textContent="Reminder: "+fired.map(function(t){return t.text}).join(", ");
    document.getElementById("alert").className="on";
  }
  document.getElementById("alertClose").onclick=function(){ document.getElementById("alert").className=""; };
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) checkReminders(); });
  setInterval(checkReminders,15000);

  render(); checkReminders();
})();
</script>
<script>
if("serviceWorker" in navigator){addEventListener("load",function(){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}});}
</script>
</body>
</html>
